name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONUTF8: "1"
      USE_MOCK_AI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install backend dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run backend tests
        working-directory: services/api
        run: python -m pytest app/tests/ -v --tb=short

      - name: Run frontend tests
        working-directory: apps/web
        run: npm test

      - name: Build backend sidecar
        working-directory: services/api
        run: python -m PyInstaller app/desktop_app.spec --clean --noconfirm

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Run desktop tests
        working-directory: apps/desktop
        run: npm test

      - name: Package desktop app
        working-directory: apps/desktop
        run: npm run dist -- --publish never

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python scripts/release_notes.py CHANGELOG.md "$TAG_NAME" > release-notes.md

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -o pipefail
          # Create the release if it does not exist yet. Matrix jobs run
          # concurrently, so a sibling job may win the create race — retry.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              break
            fi
            if gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.md; then
              break
            fi
            sleep 5
          done
          # Upload this OS's assets directly to the release — no artifact
          # upload/download round trip.
          find apps/desktop/dist -type f \
            \( -name "*.AppImage" -o -name "*.blockmap" -o -name "*.dmg" \
               -o -name "*.exe" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.yml" \) \
            ! -name "builder-debug.yml" -print0 |
            while IFS= read -r -d '' asset; do
              gh release upload "$TAG_NAME" "$asset" --clobber
            done
