name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONUTF8: "1"
      USE_MOCK_AI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install backend dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run backend tests
        working-directory: services/api
        run: python -m pytest app/tests/ -v --tb=short

      - name: Run frontend tests
        working-directory: apps/web
        run: npm test

      - name: Build backend sidecar
        working-directory: services/api
        run: python -m PyInstaller app/desktop_app.spec --clean --noconfirm

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Run desktop tests
        working-directory: apps/desktop
        run: npm test

      - name: Package desktop app
        working-directory: apps/desktop
        run: npm run dist -- --publish never

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.tar.gz
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Desktop release $TAG_NAME"
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$TAG_NAME" --clobber
