# Docker Release
#
# Builds and publishes the api + web Docker images to GitHub Container
# Registry (GHCR) when a version tag is pushed (e.g. v0.4.0). Uses the
# built-in GITHUB_TOKEN (packages: write) - no extra secrets required.
#
# Published images (GHCR namespaces are lowercase; update these if the
# repository owner changes):
#   ghcr.io/yapwh1208/article-processer-api
#   ghcr.io/yapwh1208/article-processer-web
# Tags: <semver> (e.g. 0.4.0), <major>.<minor> (e.g. 0.4), latest
#
# The opt-in mineru-api service is a third-party image (opendatalab/mineru)
# and is intentionally not built here - see docs/docker.md.

name: Docker Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./services/api
            file: services/api/Dockerfile
          - service: web
            context: ./apps/web
            file: apps/web/Dockerfile
            args: |
              NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yapwh1208/article-processer-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          args: ${{ matrix.args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
